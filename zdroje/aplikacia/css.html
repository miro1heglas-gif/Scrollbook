<style>
*{box-sizing:border-box}
body{margin:0}
.stage{width:100%;height:100vh;height:100dvh;background:#121616;display:flex;justify-content:center}
.app{--bg:#F3F6F6;--sf:#fff;--sf2:#F0F4F4;--tx:#1A1F1F;--tx2:#3F4848;--mut:#5B6566;--mut2:#4A5252;--ic:#6B7777;--ic2:#8A9696;--ln:#DDE2E2;--ln2:#EBEFEF;--ctl:#C9D2D2;--trk:#EDF1F1;--ac:#0E8080;--act:#0B6E6E;--aclnk:#0E8080;--acs:#E8F5F5;--dg:#B42318;--dgl:#F0C2BE;--okb:#E3F4F1;--okt:#0B6E6E;--wnb:#FFF1DF;--wnt:#8A4A00;--bdb:#FDECEA;--bdt:#B42318;--blb:#E6EEF9;--blt:#2F62B0;--ort:#A85A00;--ntb:#FFF6E6;--ntt:#6B4A0E;--toast:#1F2323;--scrim:rgba(18,22,22,.55);--hddk:#121616;color-scheme:only light;width:100%;max-width:480px;height:100%;position:relative;overflow:hidden;background:var(--bg);font-family:'Source Sans 3',system-ui,sans-serif;color:var(--tx);font-size:15px;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
.app[data-theme="dark"]{--bg:#0E1313;--sf:#182020;--sf2:#222B2B;--tx:#E6ECEC;--tx2:#C4CECE;--mut:#9AA7A7;--mut2:#B5C0C0;--ic:#8C9999;--ic2:#7D8A8A;--ln:#2B3535;--ln2:#232D2D;--ctl:#455252;--trk:#2A3434;--ac:#0E8080;--act:#62D2D2;--aclnk:#62D2D2;--acs:#133434;--dg:#FF8F85;--dgl:#5C2B27;--okb:#12352F;--okt:#82DECD;--wnb:#3A2A12;--wnt:#F5C077;--bdb:#3F1E1B;--bdt:#FF9C92;--blb:#1A2A44;--blt:#A2C1F4;--ort:#F5B266;--ntb:#33291A;--ntt:#F1D49A;--toast:#33403F;--scrim:rgba(0,0,0,.62);--hddk:#0A0F0F;color-scheme:only dark;}
/* vzhľad „Podľa telefónu“: skutočné pravidlo prefers-color-scheme (niektoré prehliadače podľa neho nestmavujú stránku samy) */
@media (prefers-color-scheme: dark){.app[data-theme="auto"]{--bg:#0E1313;--sf:#182020;--sf2:#222B2B;--tx:#E6ECEC;--tx2:#C4CECE;--mut:#9AA7A7;--mut2:#B5C0C0;--ic:#8C9999;--ic2:#7D8A8A;--ln:#2B3535;--ln2:#232D2D;--ctl:#455252;--trk:#2A3434;--ac:#0E8080;--act:#62D2D2;--aclnk:#62D2D2;--acs:#133434;--dg:#FF8F85;--dgl:#5C2B27;--okb:#12352F;--okt:#82DECD;--wnb:#3A2A12;--wnt:#F5C077;--bdb:#3F1E1B;--bdt:#FF9C92;--blb:#1A2A44;--blt:#A2C1F4;--ort:#F5B266;--ntb:#33291A;--ntt:#F1D49A;--toast:#33403F;--scrim:rgba(0,0,0,.62);--hddk:#0A0F0F;color-scheme:only dark;}}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--tx)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:1}
/* ikony s pevnou farbou v šablóne: farbu určuje vzhľad */
.app svg[stroke="#6B7777"]{stroke:var(--ic)}.app svg[stroke="#5B6566"]{stroke:var(--mut)}.app svg[stroke="#0E8080"]{stroke:var(--aclnk)}
button:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid #2BD0D0;outline-offset:1px}
.hd{height:56px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px 0 4px}
.logo{width:30px;height:30px;border-radius:8px;background:#0E8080;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;margin-left:10px;flex:none}
.t1{font-size:19px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:12px;position:relative;flex:none;padding:0}
.ib[data-text="true"]{padding:0 12px;font-size:16px;font-weight:700;color:var(--aclnk)}
.ib[data-k="d"],.ib[data-k="d2"]{color:var(--dg)}
.ib[disabled]{opacity:.3}
.ibadge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;border-radius:9px;background:#C8322B;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.sc::-webkit-scrollbar{width:0}
/* Firefox: skryté posuvníky ako v ostatných prehliadačoch */
.sc,.chips,.strip,.sheet-b{scrollbar-width:none}
.sc>*{flex-shrink:0}
.filters{flex:none;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 16px 10px;display:flex;flex-direction:column;gap:10px}
.srch{height:44px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;gap:8px;padding:0 12px}
.srch input{flex:1;min-width:0;border:none;outline:none;background:transparent;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 2px}
.chips::-webkit-scrollbar{height:0}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ctl);background:var(--sf);font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.chip.more{border-style:dashed;border-color:var(--aclnk);color:var(--act);font-weight:700}
.chip.dk{background:transparent;border-color:#4A5252;color:#E3E8E8}
.chip.dk[aria-pressed="true"]{background:#2BD0D0;border-color:#2BD0D0;color:#0B1F1F}
.cn{font-size:12px;font-weight:700;opacity:.9}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.card.tap{text-align:left;font-size:15px}
.apc{display:flex;flex-direction:column;align-items:stretch;width:100%}
.card.form{display:flex;flex-direction:column;gap:10px}
.h2{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:0}
.sec{display:flex;flex-direction:column;gap:8px}
.mut{color:var(--mut)}
.sm{font-size:13px}
.nm{font-size:16px;font-weight:600;display:block;line-height:1.25;overflow-wrap:anywhere}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;background:var(--sf);border:none;border-bottom:1px solid var(--ln2);width:100%;text-align:left;font-size:15px}
.list>.row:last-child,.list>*:last-child.row{border-bottom:none}
.rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:48px;border:none;background:transparent;padding:0;text-align:left;font-size:15px}
.mv{display:flex;flex:none}
.btn{height:48px;border-radius:12px;border:1px solid var(--ctl);background:var(--sf);color:var(--tx);font-size:15px;font-weight:700;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.btn[data-k="p"]{background:var(--ac);border-color:var(--ac);color:#fff}
.btn[data-k="p2"]{border-color:var(--aclnk);color:var(--act);background:var(--acs)}
.btn[data-k="d"]{color:var(--dg);border-color:var(--dgl);background:var(--sf)}
.btn.sm{height:44px;font-size:14px;padding:0 14px}
.row.wrap{flex-wrap:wrap}
.acts{display:flex;gap:8px;flex:0 0 100%;min-width:0}
.acts .btn{flex:1 1 0;min-width:0;height:auto;min-height:44px;padding:6px 10px;line-height:1.2;text-align:center;white-space:normal}
.btn[disabled]{opacity:.45}
.lnk{border:none;background:transparent;color:var(--aclnk);font-weight:700;font-size:14px;height:44px;padding:0 6px;min-width:44px}
.lnk.clr{display:inline-flex;align-items:center;gap:4px;color:var(--tx2);padding:0 4px 0 10px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--trk);color:var(--mut2);flex:none}
.pill[data-k="ok"]{background:var(--okb);color:var(--okt)}
.pill[data-k="warn"]{background:var(--wnb);color:var(--wnt)}
.pill[data-k="bad"]{background:var(--bdb);color:var(--bdt)}
.pill[data-k="blue"]{background:var(--blb);color:var(--blt)}
.pill[data-k="dark"]{background:#1F2323;color:#fff}
.pill[data-k="grey"]{background:var(--trk);color:var(--mut2)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ic2);flex:none}
.dot[data-k="ok"]{background:#2E9E4F}.dot[data-k="bad"]{background:#C8322B}.dot[data-k="warn"]{background:#E07A2B}
.offr{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.cta{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;border:none;border-radius:16px;padding:12px 16px;background:linear-gradient(135deg,#0E8080,#0B6E6E);color:#fff;box-shadow:0 6px 16px rgba(14,128,128,.3)}
.cta-i{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.ico{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--act);display:flex;align-items:center;justify-content:center;flex:none}
.cnt{min-width:30px;height:30px;border-radius:15px;background:#C8322B;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 8px}
.avatar{width:52px;height:52px;border-radius:50%;background:#0E8080;color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.empty{padding:36px 20px;text-align:center;color:var(--mut);font-size:15px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--ntb);color:var(--ntt);font-size:14px;line-height:1.35}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:18px;border:none;background:#0E8080;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(14,128,128,.4);z-index:5}
.prv{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.12);flex:none;align-self:center}
.playov{position:absolute;right:12px;bottom:12px;width:48px;height:48px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;padding-left:3px}
.bar{flex:none;display:flex;gap:10px;padding:10px 16px 12px;background:var(--sf);border-top:1px solid var(--ln)}
.chat{gap:10px;padding-bottom:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;display:flex;flex-direction:column;gap:8px;flex:none}
.msg[data-who="me"]{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:6px}
.msg[data-who="ai"]{align-self:flex-start;background:var(--sf);border:1px solid var(--ln);color:var(--tx);border-bottom-left-radius:6px}
.ai-list{display:flex;flex-direction:column;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.ai-it{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:44px;padding:9px 12px;background:var(--sf2);border:none;border-top:1px solid var(--ln);text-align:left;width:100%;color:var(--tx);font:inherit}
.ai-it:first-child{border-top:none}
.ai-it .nm{font-size:15px}
.ai-sg{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--sf2)}
.ai-sg span{flex:1;min-width:0;line-height:1.35}
.ai-acts{display:flex;flex-wrap:wrap;gap:8px}
.ai-acts .btn{flex:none}
.aiq{flex:none;background:var(--sf);border-top:1px solid var(--ln);padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px}
.aiq-r{display:flex;gap:8px;align-items:center}
.aiq-r .inp{flex:1;min-width:0;height:48px}
.aiq-send{width:48px;height:48px;border-radius:12px;border:none;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.aiq-send:disabled{opacity:.45}
.plrow{padding-right:4px;gap:4px}
.plrow .rowmain{align-items:flex-start;padding:2px 0}
.plact{color:var(--act)}
.tplw{position:relative;display:inline-block;vertical-align:top}
.tplz{position:absolute;inset:0}
.tplzb{position:absolute;border:0;padding:0;margin:0;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);cursor:pointer}
.tplzb[aria-pressed="true"]{box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #0E8080}
.tplzb:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.tplzl{display:none;position:absolute;right:5px;bottom:5px;font:700 11px/1.25 'Source Sans 3',system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px;white-space:nowrap;max-width:calc(100% - 10px);overflow:hidden;text-overflow:ellipsis}
.tplzb[aria-pressed="true"] .tplzl{display:block;background:#0E8080}
.dtr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px}
.dtr .inp{height:48px;min-width:0;font-size:16px}
.err{color:var(--dg);font-size:14px;font-weight:600}
.tplzb[data-own="3"]{background:repeating-linear-gradient(135deg,rgba(255,176,32,.34) 0 7px,rgba(255,176,32,0) 7px 14px);box-shadow:inset 0 0 0 2px #FFB020}
.tplzb[data-own="3"][aria-pressed="true"]{box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #FFB020}
.tplzb[data-own="3"] .tplzl{display:block;left:5px;top:5px;right:auto;bottom:auto;background:#7A4300}
.chip[data-own="3"]{border-style:dashed;border-color:#C27A00}
.ownleg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);text-align:left}
.ownsw{width:22px;height:16px;border-radius:3px;flex:none;background:repeating-linear-gradient(135deg,rgba(255,176,32,.55) 0 4px,rgba(255,176,32,.12) 4px 8px);box-shadow:inset 0 0 0 1.5px #FFB020}
.note.own{background:var(--wnb);color:var(--wnt)}
.chip[role="radio"][aria-checked="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.pill{gap:4px}
.list.sep{background:transparent;border:none;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:12px}
.list.sep>.row,.list.sep>.row:last-child{border:1px solid var(--ctl);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheet-b:focus,.sc:focus{outline:none}.sc:focus-visible{outline:2px solid var(--act);outline-offset:-2px}
.sheet-b:focus-visible{outline:2px solid var(--act);outline-offset:-2px}
.dtv{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:0 14px;border:1px solid var(--ctl);border-radius:12px;background:var(--sf);font-size:16px;text-align:left}
.dtv[aria-expanded="true"]{border-color:var(--act);box-shadow:inset 0 0 0 1px var(--act)}
.dtvv{font-weight:700;color:var(--act);font-variant-numeric:tabular-nums;white-space:nowrap}
.wh{position:relative;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,.8fr) minmax(0,.8fr);height:132px;border-radius:12px;background:var(--sf2);overflow:hidden;flex:none}
.wh::before{content:"";position:absolute;left:8px;right:8px;top:44px;height:44px;border-radius:10px;background:var(--sf);box-shadow:0 0 0 1px var(--ctl);pointer-events:none}
.wh::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background:linear-gradient(var(--sf2),transparent 34%,transparent 66%,var(--sf2));opacity:.85}
.whc{position:relative;height:132px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;outline-offset:-3px}
.whc::-webkit-scrollbar{display:none}
.whc:focus{outline:none}
.whc:focus-visible{outline:2px solid var(--act);outline-offset:-2px;border-radius:10px}
.whc::before,.whc::after{content:"";display:block;height:44px}
.whi{display:flex;align-items:center;justify-content:center;height:44px;scroll-snap-align:center;font-size:17px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none}
.whi[aria-selected="true"]{color:var(--tx);font-weight:700}
.pill[data-k="own"]{background:var(--wnb);color:var(--wnt);display:block;line-height:22px;max-width:100%;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.tplzb::after{content:"";position:absolute;left:calc(-1*var(--zx,0px));right:calc(-1*var(--zx,0px));top:calc(-1*var(--zy,0px));bottom:calc(-1*var(--zy,0px))}
.cn{opacity:1}
.lnk{color:var(--act)}
.t1[translate="no"]{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:17px;overflow-wrap:anywhere}
.num{width:28px;height:28px;border-radius:50%;background:var(--trk);color:var(--tx2);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.btn[data-k="df"]{background:#B42318;border-color:#B42318;color:#fff}
.list:empty{display:none}.list:not(:has(> *)){display:none}
.chip{min-width:44px;justify-content:center}
.row[aria-disabled="true"]{opacity:.6}
.inp[aria-invalid="true"]{border-color:var(--dg)}
.imgacts{display:flex;gap:10px}.imgacts .btn{flex:1 1 0}
.ctcur{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--ctl);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;text-align:left}
.ctg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ctb{display:flex;align-items:flex-start;gap:8px;min-height:64px;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;text-align:left}
.ctb[aria-checked="true"]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac);background:var(--acs)}
.cti{flex:none;color:var(--tx2);display:flex;padding-top:1px}
.ctt{display:block;font-weight:700;font-size:14px;line-height:1.2}
.cts{display:block;font-size:12px;color:var(--mut);line-height:1.25;margin-top:2px}
.tabs{height:64px;flex:none;display:flex;background:var(--sf);border-top:1px solid var(--ln)}
.tab{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);position:relative;padding:0}
.tab[aria-current="page"]{color:var(--act)}
.badge{position:absolute;top:5px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:#C8322B;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sheetbg{position:absolute;left:0;right:0;top:0;bottom:64px;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet{background:var(--sf);border-radius:22px 22px 0 0;max-height:86%;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--ctl);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:4px;padding:4px 6px 2px 14px;flex:none}
.shh{flex:1;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-b>*{flex-shrink:0}
.sheet-f{padding:10px 16px 18px;display:flex;gap:10px;border-top:1px solid var(--ln2);flex:none}
.inp{width:100%;height:48px;border:1px solid var(--ctl);border-radius:12px;padding:0 14px;background:var(--sf)}
textarea.inp{height:auto;padding:12px 14px;resize:none;line-height:1.35}
.lbl{font-size:13px;font-weight:700;color:var(--tx2)}
.seg{display:flex;border:1px solid var(--ctl);border-radius:12px;overflow:hidden;background:var(--sf);flex:none}
