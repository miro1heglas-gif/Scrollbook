<title>Scrollbook</title>
<style>
/* Layout: song list screen and a full-height reader with a fixed control bar; stage look, dark first */
:root{--bg:#0e0f12;--panel:#17181d;--line:#2a2c34;--fg:#f2efe8;--dim:#8d909b;--accent:#ffb43a;--note:#ff5c5c;--hl:#4dff6e;--sky:#74c7ff;--on-accent:#1a1204;
--sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4ef;--panel:#ffffff;--line:#dcd8cd;--fg:#17181d;--dim:#666a75;--accent:#a35a00;--note:#c40000;--hl:#0a7a1f;--sky:#1c6fbd;--on-accent:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f4ef;--panel:#ffffff;--line:#dcd8cd;--fg:#17181d;--dim:#666a75;--accent:#a35a00;--note:#c40000;--hl:#0a7a1f;--sky:#1c6fbd;--on-accent:#fff;color-scheme:light}
html,body{height:100%}
html{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#list,#reader{height:100%;display:flex;flex-direction:column;min-height:0}
header{padding-block:18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:1.5rem;margin:0;font-weight:600;text-wrap:balance}
.count{color:var(--dim);font-size:.9rem}
#songs{list-style:none;margin:0;padding:0 0 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px}
#songs button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:14px 16px;font:inherit;display:flex;gap:14px;align-items:center;cursor:pointer;min-height:56px}
#songs .n{font-family:var(--mono);color:var(--accent);min-width:2ch;text-align:right}
#songs .t{font-weight:600;display:block}
#songs .a{color:var(--dim);font-size:.9rem}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
#bar .ttl{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .ttl small{color:var(--dim);font-weight:400;margin-left:8px}
#text{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0;font-family:var(--mono);cursor:pointer}
#text::before{content:"";display:block;height:30vh}
#text::after{content:"";display:block;height:80vh}
.row{white-space:pre;line-height:1.3;font-size:var(--fs,26px)}
.ch{color:var(--accent);font-weight:600;min-height:0}
.ly{margin-bottom:.25em}
.ly b{font-weight:700;color:var(--hl)}
.g{color:var(--sky);font-weight:600}
.note{color:var(--note);font-weight:600}
.gap{height:.8em}
.nochords .ch{display:none}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);justify-content:center}
.ctrl button,#bar button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;min-width:48px;min-height:48px;padding:0 14px;font:600 1rem var(--sans);cursor:pointer}
#bar .big{background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-height:60px;min-width:140px;font-size:1.5rem;padding:0 28px}
.ctrl .play{background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-width:110px}
.ctrl .val{font-family:var(--mono);min-width:3ch;text-align:center;color:var(--dim)}
.grp{display:flex;align-items:center;gap:6px}
.lab{color:var(--dim);font-size:.8rem}
.tgl[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
</style>

<div id="list">
  <header><h1>Scrollbook</h1><span class="count" id="count"></span></header>
  <ul id="songs"></ul>
</div>
<div id="reader" hidden>
  <div id="bar">
    <button id="back" aria-label="Späť na zoznam">‹ Zoznam</button>
    <div class="ttl" id="ttl"></div>
    <button class="big" id="play2">Štart</button>
  </div>
  <div id="text" tabindex="0" aria-label="Text piesne, klepnutím spustíš alebo zastavíš posúvanie"></div>
  <div class="ctrl">
    <button class="play" id="play">Štart</button>
    <div class="grp"><span class="lab">Rýchlosť</span><button id="slow" aria-label="Pomalšie">−</button><span class="val" id="spd"></span><button id="fast" aria-label="Rýchlejšie">+</button></div>
    <div class="grp"><span class="lab">Písmo</span><button id="fs-" aria-label="Menšie písmo">A−</button><button id="fs+" aria-label="Väčšie písmo">A+</button></div>
    <button class="tgl" id="chords" aria-pressed="true">Akordy</button>
    <span class="lab" id="kb">Kláves: –</span>
    <button id="skip" aria-label="10 riadkov nižšie">10 ↓</button>
    <button id="top" aria-label="Na začiatok">⤒</button>
  </div>
</div>

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

$('count').textContent=SONGS.length+' piesní';
$('songs').innerHTML=SONGS.map((s,i)=>`<li><button data-i="${i}"><span class="n">${i+1}</span><span><span class="t">${esc(s.title)}</span><span class="a">${esc(s.artist)}</span></span></button></li>`).join('');
$('songs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)open(+b.dataset.i)});

function open(i){
  cur=i;const s=SONGS[i];st.speed=s.speed||30;
  $('ttl').innerHTML=esc(s.title)+'<small>'+esc(s.artist)+'</small>';
  $('text').innerHTML=s.lines.map(l=>'<div class="ln">'+(l=>{
    if(!l.c&&!l.s.length)return '<div class="row ly">&nbsp;</div>';
    const ch=l.c?`<div class="row ch">${esc(l.c)}</div>`:'';
    const tx=l.s.length?`<div class="row ly">${l.s.map(([x,f])=>f==='b'?`<b>${esc(x)}</b>`:f==='n'?`<span class="note">${esc(x)}</span>`:f==='g'?`<span class="g">${esc(x)}</span>`:f==='i'?`<i>${esc(x)}</i>`:esc(x)).join('')}</div>`:'';
    return ch+tx;
  })(l)+'</div>').join('');
  $('list').hidden=true;$('reader').hidden=false;
  $('text').scrollTop=0;pos=0;stop();apply();
}
function apply(){
  document.documentElement.style.setProperty('--fs',st.fs+'px');
  $('spd').textContent=st.speed;
  $('text').classList.toggle('nochords',!st.chords);
  $('chords').setAttribute('aria-pressed',st.chords);
}
function tick(t){
  if(!playing)return;
  const el=$('text');
  const dt=Math.min(.1,(t-last)/1000);last=t;
  if(Math.abs(el.scrollTop-pos)>2)pos=el.scrollTop;
  pos+=st.speed*dt;
  el.scrollTop=pos;
  if(pos>=el.scrollHeight-el.clientHeight-1){stop();return}
  raf=requestAnimationFrame(tick);
}
async function start(){
  if(playing)return;playing=true;$('play').textContent=$('play2').textContent='Pauza';
  pos=$('text').scrollTop;last=performance.now();raf=requestAnimationFrame(tick);
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}
}
function stop(){
  playing=false;cancelAnimationFrame(raf);$('play').textContent=$('play2').textContent='Štart';
  try{if(wake){wake.release();wake=null}}catch(e){}
}
const toggle=()=>playing?stop():start();
$('play').onclick=toggle;$('play2').onclick=toggle;
$('text').addEventListener('click',toggle);
$('slow').onclick=()=>{st.speed=Math.max(5,st.speed-5);apply();save()};
$('fast').onclick=()=>{st.speed=Math.min(200,st.speed+5);apply();save()};
$('fs-').onclick=()=>{st.fs=Math.max(14,st.fs-2);apply();save()};
$('fs+').onclick=()=>{st.fs=Math.min(60,st.fs+2);apply();save()};
$('chords').onclick=()=>{st.chords=!st.chords;apply();save()};
$('skip').onclick=()=>skip(10);
$('top').onclick=()=>{stop();$('text').scrollTop=0;pos=0};
$('back').onclick=()=>{stop();$('reader').hidden=true;$('list').hidden=false};
let animRaf=0;
function animateTo(y){
  const box=$('text'),start=box.scrollTop,d=y-start,t0=performance.now(),dur=300;
  cancelAnimationFrame(animRaf);
  function f(t){
    const k=Math.min(1,(t-t0)/dur);
    box.scrollTop=start+d*(0.5-0.5*Math.cos(Math.PI*k));
    pos=box.scrollTop;
    if(k<1)animRaf=requestAnimationFrame(f);
  }
  animRaf=requestAnimationFrame(f);
}
function skip(n){
  const box=$('text'),rows=Array.from(box.querySelectorAll('.ln'));
  if(!rows.length)return;
  const base=box.getBoundingClientRect().top-box.scrollTop;
  const tops=rows.map(r=>r.getBoundingClientRect().top-base);
  const ref=box.scrollTop+box.clientHeight*0.3;
  let cur=0;tops.forEach((y,i)=>{if(y<=ref+2)cur=i});
  const tgt=Math.max(0,Math.min(cur+n,rows.length-1));
  $('kb').textContent='Skok: riadok '+(cur+1)+' → '+(tgt+1);
  animateTo(Math.max(0,tops[tgt]-box.clientHeight*0.3));
}
// Bluetooth pedal (M-Vave Cube Turner) types keys.
// Left pedal (Left/Up/PageUp) = start/pause. Right pedal (Right/Down/PageDown/Space/Enter): tap = 10 lines down, hold = 10 lines up.
const LEFT=['ArrowLeft','ArrowUp','PageUp'],RIGHT=['ArrowRight','ArrowDown','PageDown',' ','Enter'];
let rightHeld=false,holdFired=false,holdTimer=0;
document.addEventListener('keydown',e=>{
  if(!$('reader').hidden)$('kb').textContent='Kláves: '+(e.key===' '?'medzera':e.key);
  if($('reader').hidden)return;
  if(LEFT.includes(e.key)){e.preventDefault();if(!e.repeat)toggle()}
  else if(RIGHT.includes(e.key)){
    e.preventDefault();
    if(rightHeld)return;
    rightHeld=true;holdFired=false;
    holdTimer=setTimeout(()=>{holdFired=true;skip(-10)},600);
  }
  else if(e.key==='+'){st.speed=Math.min(200,st.speed+5);apply();save()}
  else if(e.key==='-'){st.speed=Math.max(5,st.speed-5);apply();save()}
});
document.addEventListener('keyup',e=>{
  if(RIGHT.includes(e.key)&&rightHeld){
    clearTimeout(holdTimer);
    if(!holdFired&&!$('reader').hidden)skip(10);
    rightHeld=false;
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
apply();
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body></html>
