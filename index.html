#list>*{position:relative;z-index:1}
#songs button{background:rgba(23,24,29,.7);background:color-mix(in srgb,var(--panel) 70%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none}
#songs .n{font-family:var(--mono);color:var(--accent);min-width:2ch;text-align:right;font-size:1.6rem}
#songs .tx{flex:1;min-width:0}
#songs .tag{flex:none;font-family:var(--mono);font-weight:700;font-size:1.4rem;line-height:1;white-space:nowrap;background:#ffe14d;color:#1a1204;padding:8px 12px;border-radius:7px}
#songs .t{font-weight:600;display:block;font-size:1.9rem;line-height:1.2}
#songs .a{color:var(--dim);font-size:1.35rem;display:block;margin-top:3px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
#bar .ttl{flex:1 1 300px;min-width:0;font-weight:600;font-size:2rem;line-height:1.15}
#bar .ttl small{display:block;font-size:2rem;color:var(--dim);font-weight:400;margin:2px 0 0}
#text{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0;font-family:var(--mono);cursor:pointer}
#text::before{content:"";display:block;height:30vh}
#text::after{content:"";display:block;height:var(--tail,20vh)}
.row{white-space:pre;line-height:1.3;font-size:var(--fs,26px)}
.ch{color:var(--accent);font-weight:600;min-height:0}
.ly{margin-bottom:.25em}
.ly b{font-weight:700;color:var(--hl)}
.g{color:var(--sky);font-weight:600}
.note{color:var(--note);font-weight:600}
.gap{height:.8em}
.nochords .ch{display:none}
.ctrl{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);justify-content:flex-start}
.ctrl button,#bar button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;min-width:48px;min-height:48px;padding:0 14px;font:600 1rem var(--sans);cursor:pointer}
#bar .big{background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-height:60px;min-width:140px;font-size:1.5rem;padding:0 28px}
.ctrl .play{background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-width:110px}
.ctrl .val{font-family:var(--mono);min-width:3ch;text-align:center;color:var(--dim)}
.grp{display:flex;align-items:center;gap:6px}
.lab{color:var(--dim);font-size:.8rem}
.tgl[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
[hidden]{display:none!important}
#songs .rt{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
#songs .pgs{font-family:var(--mono);font-size:1.3rem;line-height:1;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:7px 11px;white-space:nowrap}
#rtag{flex:none;font-family:var(--mono);font-weight:800;font-size:2rem;line-height:1;white-space:nowrap;background:#ffe14d;color:#1a1204;padding:10px 16px;border-radius:9px;box-shadow:0 0 0 2px rgba(255,225,77,.35)}
.ctrl .play,.ctrl .backbig{background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-height:60px;min-width:160px;font-size:1.4rem;padding:0 26px}
.ctrl .backbig{margin-left:auto}
.ctrl .play.on{background:#000;color:var(--accent);border-color:var(--accent);border-width:2px}
button.pedwarn{background:#ff4d3d!important;color:#fff!important;border-color:#ff4d3d!important;animation:pw 1.1s ease-in-out infinite}
@keyframes pw{0%,100%{box-shadow:0 0 0 0 rgba(255,77,61,.7)}50%{box-shadow:0 0 0 9px rgba(255,77,61,0)}}
.hrow{display:flex;gap:8px;align-items:center}
.lbtn{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 16px;font:600 1rem var(--sans);cursor:pointer}
#logos{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#logos .lhd{display:flex;align-items:center;gap:10px;padding-top:10px}
#logos .lsets{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
#logos .lsets::-webkit-scrollbar{display:none}
#logos .lsets button{flex:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;font:600 .95rem var(--sans);cursor:pointer;white-space:nowrap}
#logos .lsets button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(255,180,58,.12)}
#logos .lhd2{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
#logos .lmsg{color:var(--dim);font-size:1.15rem;text-align:center;padding:20px}
#logos .lsave{color:var(--dim);font-size:1rem;text-align:center;margin-top:1.4em}
#logos .lhint{flex:1;color:var(--fg);font-weight:600;font-size:1.05rem;text-align:right}
#logos .lstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:10px}
#logos .ltext{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:760px;margin-inline:auto;padding:4px 4px 40px;font-size:1.25rem;line-height:1.5}
#logos .ltext h2{font-size:1.8rem;margin:.2em 0 .6em;color:var(--accent);text-align:center}
#logos .ltext p{margin:0 0 .9em}
#logos .ltext b{color:var(--accent)}
#logos #logoMini{display:block;max-width:220px;max-height:180px;width:auto;height:auto;margin:0 auto;border-radius:14px}
#logos .lstage>img{display:block;width:100%;height:100%;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
/* prepínače režimu (Text/PDF) a zobrazenia PDF (Strana/Šírka) */
.hrt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
#list .seg button,#bar .seg button,#logos .seg button{background:transparent;color:var(--dim);border:0;border-radius:0;min-width:0;min-height:44px;padding:0 14px;font:600 1rem var(--sans);cursor:pointer}
#bar .seg button{min-height:48px}
#list .seg button[aria-pressed="true"],#bar .seg button[aria-pressed="true"],#logos .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#pginfo{font-family:var(--mono);color:var(--dim);white-space:nowrap;font-size:1.05rem}
#pdfv{flex:1;min-height:0;overflow:hidden;position:relative;background:#000;cursor:pointer;touch-action:pan-y}
#pdfv.fitw{overflow-y:auto;-webkit-overflow-scrolling:touch}
#pdfv .pg{display:flex;align-items:center;justify-content:center}
#pdfv.fitw .pg{padding:3px 0}
#pdfv canvas{display:block;background:#fff}
#pmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;color:var(--dim);padding:24px;font-size:1.15rem;pointer-events:none}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(0,0,0,.88);color:#fff;border:2px solid var(--accent);border-radius:16px;padding:18px 34px;font:700 1.9rem var(--sans);z-index:50;pointer-events:none;text-align:center;white-space:pre-line;line-height:1.35}

    if(on){if(!wake&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}
    else if(wake){const w=wake;wake=null;w.release()}
  }catch(e){}
}
function tick(t){
  if(!playing)return;
  const el=$('text');
  const dt=Math.min(.1,(t-last)/1000);last=t;
  if(Math.abs(el.scrollTop-pos)>2)pos=el.scrollTop;
  pos+=st.speed*dt;
  el.scrollTop=pos;
  if(pos>=el.scrollHeight-el.clientHeight-1){stop();return}
  raf=requestAnimationFrame(tick);
}
function start(){
  if(playing||st.mode==='pdf')return;playing=true;$('play').textContent='Pauza';$('play').classList.add('on');
  pos=$('text').scrollTop;last=performance.now();raf=requestAnimationFrame(tick);
  keepAwake(true);
}
function stop(){
  playing=false;cancelAnimationFrame(raf);$('play').textContent='Štart';$('play').classList.remove('on');
  if(st.mode!=='pdf'||!readerOpen())keepAwake(false);
}
const toggle=()=>playing?stop():start();
$('play').onclick=toggle;
$('text').addEventListener('click',toggle);
$('slow').onclick=()=>{st.speed=Math.max(5,st.speed-5);apply();save()};
$('fast').onclick=()=>{st.speed=Math.min(200,st.speed+5);apply();save()};
const goBack=()=>{PV.tok++;PV.gen++;stop();keepAwake(false);$('reader').hidden=true;$('list').hidden=false};
$('back').onclick=goBack;$('back2').onclick=goBack;
let animRaf=0;
function animateTo(y,box){
  box=box||$('text');
  const isText=box.id==='text',start=box.scrollTop,d=y-start,t0=performance.now(),dur=300;
  cancelAnimationFrame(animRaf);
  function f(t){
    const k=Math.min(1,(t-t0)/dur);
    box.scrollTop=start+d*(0.5-0.5*Math.cos(Math.PI*k));
    if(isText)pos=box.scrollTop;
    if(k<1)animRaf=requestAnimationFrame(f);else if(!isText)pdfInfo();
  }
  animRaf=requestAnimationFrame(f);
}
function lineTops(){
  const box=$('text'),rows=Array.from(box.querySelectorAll('.ln'));
  const base=box.getBoundingClientRect().top-box.scrollTop;
  return rows.map(r=>r.getBoundingClientRect().top-base);
}
function curLine(tops){
  const box=$('text'),ref=box.scrollTop+box.clientHeight*0.3;
  let c=0;tops.forEach((y,i)=>{if(y<=ref+2)c=i});return c;
}
function skip(n){
  const box=$('text'),tops=lineTops();
  if(!tops.length)return;
  const c=curLine(tops),tgt=Math.max(0,Math.min(c+n,tops.length-1));
  animateTo(Math.max(0,tops[tgt]-box.clientHeight*0.3));
}
// poloha v piesni ako zlomok 0..1 (pri prepínaní Text <-> PDF sa zachová)
function textFrac(){const tops=lineTops();return tops.length?curLine(tops)/tops.length:0}
function setTextFrac(f){
  const box=$('text'),tops=lineTops();if(!tops.length)return;
  const i=Math.max(0,Math.min(tops.length-1,Math.round(f*tops.length)));
  box.scrollTop=i?Math.max(0,tops[i]-box.clientHeight*0.3):0;pos=box.scrollTop;
}
const curFrac=()=>st.mode==='pdf'?PV.frac:textFrac();

// ---------- režimy: Text (rolovanie) a PDF (listovanie) – menia sa len tlačidlom alebo pedálom, nie otočením tabletu
function setTail(){const t=$('text');if(t.clientHeight)t.style.setProperty('--tail',Math.round(t.clientHeight*0.2)+'px')}
function showMode(frac){
  const pdf=st.mode==='pdf';
  $('text').hidden=pdf;$('ctrl').hidden=pdf;$('back').hidden=!pdf;$('ped2').hidden=!pdf;
  $('pdfv').hidden=!pdf;$('pginfo').hidden=!pdf;
  apply();setTail();
  if(pdf){stop();keepAwake(true);openPdf(frac)}
  else{PV.tok++;PV.gen++;keepAwake(false);requestAnimationFrame(()=>setTextFrac(frac))}
}
function setMode(m,frac,byPedal){
  if(m!=='pdf')m='text';
  if(st.mode===m)return;
  st.mode=m;save();apply();
  const msg=(m==='pdf'?'PDF – listovanie':'Scroll – rolovanie')+(byPedal?(m==='pdf'?'\npedál portrait ↑ ↓':'\npedál landscape ← →'):'');
  if(readerOpen())showMode(frac);
  toast(msg);
}
$('mText').onclick=()=>setMode('text',0);
$('mPdf').onclick=()=>setMode('pdf',0);
$('bText').onclick=()=>setMode('text',curFrac());
$('bPdf').onclick=()=>setMode('pdf',curFrac());
let toastT=0;
function toast(s,ms){const el=$('toast');el.textContent=s;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms||1400)}

// ---------- PDF (PDF.js 3.11.174 v súboroch pdf.min.js a pdf.worker.min.js)
const PV={doc:null,file:null,crop:null,n:0,frac:0,layout:null,tok:0,gen:0};
let libP=null;
function loadLib(){
  if(!libP)libP=new Promise((ok,no)=>{
    const s=document.createElement('script');s.src='pdf.min.js';
    s.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';ok(pdfjsLib)}catch(e){no(e)}};
    s.onerror=()=>no(new Error('pdf.min.js'));document.head.appendChild(s);
  }).catch(e=>{libP=null;throw e});
  return libP;
}
const docs=new Map();
function getDoc(file){
  if(!docs.has(file)){
    const p=(async()=>{
      const lib=await loadLib();
      const r=await fetch(file);if(!r.ok)throw new Error(file);
      const pdf=await lib.getDocument({data:new Uint8Array(await r.arrayBuffer())}).promise;
      return {pdf,crop:await cropOf(pdf)};
    })();
    docs.set(file,p);p.catch(()=>docs.delete(file));
  }
  return docs.get(file);
}
// spoločný výrez bez bielych okrajov pre všetky strany (rovnaká veľkosť písma na každej strane)
async function cropOf(pdf){
  let x0=1e9,y0=1e9,x1=-1,y1=-1,pw=0,ph=0;const sc=0.5;
  for(let k=1;k<=pdf.numPages;k++){
    const page=await pdf.getPage(k),v1=page.getViewport({scale:1}),v=page.getViewport({scale:sc});
    pw=Math.max(pw,v1.width);ph=Math.max(ph,v1.height);
    const c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);
    const g=c.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:g,viewport:v}).promise;
    const d=g.getImageData(0,0,c.width,c.height).data,w=c.width,h=c.height;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
      if(d[i]<230||d[i+1]<230||d[i+2]<230){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  }
  if(x1<0)return {x:0,y:0,w:pw,h:ph};
  const pad=12,x=Math.max(0,x0/sc-pad),y=Math.max(0,y0/sc-pad),X=Math.min(pw,(x1+1)/sc+pad),Y=Math.min(ph,(y1+1)/sc+pad);
  return {x,y,w:X-x,h:Y-y};
}
function pmsg(s){$('pmsg').textContent=s;$('pmsg').hidden=!s}
async function openPdf(frac){
  const s=SONGS[cur],tok=++PV.tok;
  $('pdfv').classList.toggle('fitw',st.fit==='width');
  if(!s.pdf){PV.doc=null;PV.file=null;PV.layout=null;$('pin').innerHTML='';$('pginfo').textContent='';pmsg('K tejto pesničke nie je PDF.');return}
  if(PV.file!==s.pdf||!PV.doc){
    PV.doc=null;PV.layout=null;$('pin').innerHTML='';$('pginfo').textContent='';pmsg('Načítavam PDF…');
    try{
      const d=await getDoc(s.pdf);if(tok!==PV.tok)return;
      PV.doc=d.pdf;PV.crop=d.crop;PV.n=d.pdf.numPages;PV.file=s.pdf;
    }catch(e){
      if(tok!==PV.tok)return;
      pmsg('PDF sa nepodarilo načítať ('+s.pdf+').\nPrepni pedál na portrait alebo klepni na Scroll.');return;
    }
  }
  pmsg('');
  layoutPdf(frac);
}
async function layoutPdf(frac){
  const box=$('pdfv'),pin=$('pin'),g=++PV.gen;
  if(!PV.doc)return;
  const fitw=st.fit==='width';box.classList.toggle('fitw',fitw);
  PV.layout=null;pin.innerHTML='';
  const W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
  const c=PV.crop,s=fitw?W/c.w:Math.min(W/c.w,H/c.h),dpr=Math.min(window.devicePixelRatio||1,2);
  const cvs=[];
  for(let k=1;k<=PV.n;k++){
    const d=document.createElement('div');d.className='pg';if(!fitw)d.style.height=H+'px';
    const cv=document.createElement('canvas');cv.style.width=Math.round(c.w*s)+'px';cv.style.height=Math.round(c.h*s)+'px';
    d.appendChild(cv);pin.appendChild(d);cvs.push(cv);
  }
  PV.layout={fitw,H};
  setPdfFrac(frac);
  const order=[...Array(PV.n).keys()],first=pdfPage()-1;order.sort((a,b)=>Math.abs(a-first)-Math.abs(b-first));
  for(const i of order){
    if(g!==PV.gen)return;
    const page=await PV.doc.getPage(i+1),sc=s*dpr,v=page.getViewport({scale:sc,offsetX:-c.x*sc,offsetY:-c.y*sc});
    const tmp=document.createElement('canvas');tmp.width=Math.round(c.w*sc);tmp.height=Math.round(c.h*sc);
    await page.render({canvasContext:tmp.getContext('2d'),viewport:v}).promise;
    if(g!==PV.gen)return;
    const cv=cvs[i];cv.width=tmp.width;cv.height=tmp.height;cv.getContext('2d').drawImage(tmp,0,0);
  }
}
function pdfPage(){
  const box=$('pdfv'),L=PV.layout;if(!L)return 1;
  if(!L.fitw)return Math.min(PV.n,Math.round(box.scrollTop/L.H)+1);
  const pgs=box.querySelectorAll('.pg');let k=1;
  pgs.forEach((p,i)=>{if(p.offsetTop<=box.scrollTop+box.clientHeight*0.3)k=i+1});return k;
}
function pdfInfo(){
  const box=$('pdfv'),L=PV.layout;if(!L||!PV.n)return;
  PV.frac=L.fitw?(box.scrollHeight?(box.scrollTop+box.clientHeight*0.05)/box.scrollHeight:0):(pdfPage()-1)/PV.n;
  $('pginfo').textContent='str. '+pdfPage()+'/'+PV.n;
}
function setPdfFrac(f){
  const box=$('pdfv'),L=PV.layout;if(!L)return;
  f=Math.max(0,Math.min(1,f||0));
  if(!L.fitw)box.scrollTop=Math.min(PV.n-1,Math.floor(f*PV.n+1e-6))*L.H;
  else box.scrollTop=Math.max(0,Math.min(box.scrollHeight-box.clientHeight,f*box.scrollHeight-box.clientHeight*0.05));
  pdfInfo();PV.frac=f;
}
function pdfStep(d){
  const box=$('pdfv'),L=PV.layout;if(!L||!PV.n)return;
  if(!L.fitw){
    const k=Math.round(box.scrollTop/L.H),t=Math.max(0,Math.min(PV.n-1,k+d));
    if(t===k)return;
    animateTo(t*L.H,box);
  }else{
    const max=box.scrollHeight-box.clientHeight,t=Math.max(0,Math.min(max,box.scrollTop+d*box.clientHeight*0.85));
    if(Math.abs(t-box.scrollTop)<2)return;
    animateTo(t,box);
  }
}
$('pdfv').addEventListener('scroll',()=>{if(PV.layout)pdfInfo()},{passive:true});
let swX=null,swY=null,swT=0;
$('pdfv').addEventListener('touchstart',e=>{swX=e.touches[0].clientX;swY=e.touches[0].clientY},{passive:true});
$('pdfv').addEventListener('touchend',e=>{
  if(swX===null||st.fit==='width'){swX=null;return}
  const dx=e.changedTouches[0].clientX-swX,dy=e.changedTouches[0].clientY-swY;swX=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))>50){pdfStep((Math.abs(dx)>Math.abs(dy)?dx:dy)<0?1:-1);swT=Date.now()}
},{passive:true});
$('pdfv').addEventListener('click',e=>{
  if(Date.now()-swT<400)return;
  const r=$('pdfv').getBoundingClientRect();pdfStep(e.clientX-r.left<r.width*0.3?-1:1);
});
let rsT=0;
addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(readerOpen())setTail();if(readerOpen()&&st.mode==='pdf'&&PV.doc)layoutPdf(PV.frac)},200)});

// ---------- Logo: návrhy (logos.json), každý má Logo / 2 riadky / 1 riadok / Význam
// PNG, aby sa dali podržaním uložiť do Fotiek; súbor sa načíta až pri otvorení okna
const VIEWS=['Logo','2 riadky','1 riadok','Význam'];
let LSETS=null,lsetsP=null,logoS=0,logoV=0;
const pngCache=new Map();
function loadLogos(){
  if(!lsetsP)lsetsP=fetch('logos-37.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>LSETS=d).catch(e=>{lsetsP=null;throw e});
  return lsetsP;
}
function svgToPng(svg,w,h){
  return new Promise(ok=>{
    const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg width="'+w+'" height="'+h+'" '));
    const im=new Image();
    im.onload=()=>{try{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);ok(c.toDataURL('image/png'))}catch(e){ok(src)}};
    im.onerror=()=>ok(src);im.src=src;
  });
}
function viewPng(si,vi){
  const k=si+'/'+vi;
  if(!pngCache.has(k)){const v=LSETS[si].views[vi];pngCache.set(k,svgToPng(v.svg,v.w,v.h))}
  return pngCache.get(k);
}
async function showLogos(){
  $('logos').hidden=false;
  if(!LSETS){
    $('logoMsg').hidden=false;$('logoMsg').textContent='Načítavam logá…';$('logoImg').hidden=true;$('logoText').hidden=true;
    try{await loadLogos()}catch(e){$('logoMsg').textContent='Logá sa nepodarilo načítať (súbor logos-37.json).';return}
    $('logoMsg').hidden=true;
  }
  logoS=Math.max(0,Math.min(LSETS.length-1,logoS));
  $('logoSets').innerHTML=LSETS.map((l,i)=>`<button data-s="${i}" aria-pressed="${i===logoS}">${esc(l.short||l.name)}</button>`).join('');
  const cur=$('logoSets').children[logoS];if(cur)cur.scrollIntoView({block:'nearest',inline:'nearest'});
  $('logoTabs').innerHTML=VIEWS.map((n,i)=>`<button data-v="${i}" aria-pressed="${i===logoV}">${n}</button>`).join('');
  const set=LSETS[logoS];$('logoName').textContent=set.name;
  const txt=logoV===3;$('logoText').hidden=!txt;$('logoImg').hidden=txt;
  const s=logoS,v=logoV;
  if(txt){$('logoMean').innerHTML=set.meaning;$('logoText').scrollTop=0;$('logoMini').removeAttribute('src');const p=await viewPng(s,0);if(s===logoS&&v===logoV)$('logoMini').src=p;return}
  $('logoImg').removeAttribute('src');
  const p=await viewPng(s,v);
  if(s!==logoS||v!==logoV)return;
  $('logoImg').src=p;$('logoImg').alt=set.name+' – '+VIEWS[v];
  viewPng(s,(v+1)%3);                                   // ďalší pohľad pripraviť vopred
}
// pedál/potiahnutie: ďalší pohľad, po Význame ďalší návrh
function logoGo(d){
  if(!LSETS)return;
  logoV+=d;
  if(logoV>3){logoV=0;logoS=(logoS+1)%LSETS.length}
  if(logoV<0){logoV=3;logoS=(logoS-1+LSETS.length)%LSETS.length}
  showLogos();
}
$('logoSets').addEventListener('click',e=>{const b=e.target.closest('button');if(b){logoS=+b.dataset.s;showLogos()}});
$('logoTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){logoV=+b.dataset.v;showLogos()}});
let lgX=null,lgY=null;
$('logoStage').addEventListener('touchstart',e=>{lgX=e.touches[0].clientX;lgY=e.touches[0].clientY},{passive:true});
$('logoStage').addEventListener('touchend',e=>{
  if(lgX===null)return;const dx=e.changedTouches[0].clientX-lgX,dy=e.changedTouches[0].clientY-lgY;lgX=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))logoGo(dx<0?1:-1);
},{passive:true});
$('logoBtn').onclick=showLogos;
$('logoClose').onclick=()=>{$('logos').hidden=true};

// ---------- Bluetooth pedál (M-Vave Cube Turner) posiela klávesy.
// Režim pedála určuje režim aplikácie:
//   pedál NA ŠÍRKU (landscape, podržať ľavý pedál)  -> posiela ← →  -> Scroll (rolovanie)
//   pedál NA VÝŠKU (portrait, podržať pravý pedál)  -> posiela ↑ ↓  -> PDF (listovanie)
// Prvé stlačenie po zmene režimu pedála len prepne režim aplikácie (nič iné neurobí).
// Text: ľavý = štart/pauza, pravý = 10 riadkov nižšie.
// PDF:  ľavý = predošlá strana, pravý = ďalšia strana.
const LEFT=['ArrowLeft','ArrowUp','PageUp'],RIGHT=['ArrowRight','ArrowDown','PageDown',' ','Enter'];
const orientOf=k=>(k==='ArrowUp'||k==='ArrowDown')?'p':(k==='ArrowLeft'||k==='ArrowRight')?'l':null;
let pedalOrient=null;
let lastKey=0,armAt=Date.now(),pedalWarn=false;
// iPad nehlási odpojenie Bluetooth pedála, preto sa sleduje ticho: ak nie je zapnuté rolovanie a dlho nepríde žiadna klávesa, tlačidlo Pedál zbelie červené
function pedalUI(){['ped','ped2'].forEach(id=>{const b=$(id);b.classList.toggle('pedwarn',pedalWarn);b.textContent=pedalWarn?'Pedál ⚠':'Pedál ⟳'})}
function pedalCheck(){
  const idle=Date.now()-Math.max(lastKey,armAt),lim=st.mode==='pdf'?60000:20000;
  const w=readerOpen()&&$('logos').hidden&&!playing&&idle>lim;
  if(w!==pedalWarn){pedalWarn=w;pedalUI()}
}
setInterval(pedalCheck,1500);
function onKey(e){
  lastKey=Date.now();
  if(pedalWarn){pedalWarn=false;pedalUI()}
  if(!$('logos').hidden){
    if(e.key==='Escape')$('logos').hidden=true;
    else if(LEFT.includes(e.key)||RIGHT.includes(e.key)){e.preventDefault();if(!e.repeat)logoGo(LEFT.includes(e.key)?-1:1)}
    return;
  }
  const pedal=LEFT.includes(e.key)||RIGHT.includes(e.key);
  if(readerOpen()&&pedal)e.preventDefault();
  if(!pedal&&e.key!=='+'&&e.key!=='-')return;
  if(e.repeat)return;
  const o=orientOf(e.key);
  if(o){
    // zmena režimu pedála (alebo prvé stlačenie, ak nesedí s režimom aplikácie)
    const changed=pedalOrient?o!==pedalOrient:(o==='p')!==(st.mode==='pdf');
    pedalOrient=o;
    if(changed){const m=o==='p'?'pdf':'text';if(st.mode!==m){setMode(m,readerOpen()?curFrac():0,true);return}}
  }
  if(!readerOpen())return;
  const pdf=st.mode==='pdf';
  if(LEFT.includes(e.key)){if(pdf)pdfStep(-1);else toggle()}
  else if(RIGHT.includes(e.key)){
    if(pdf){pdfStep(1);return}
    skip(10);
  }
  else if(!pdf&&e.key==='+'){st.speed=Math.min(200,st.speed+5);apply();save()}
  else if(!pdf&&e.key==='-'){st.speed=Math.max(5,st.speed-5);apply();save()}
}
window.addEventListener('keydown',onKey,true);
// Inicializácia pedála: skrytý vstup drží fokus, aby iPad posielal klávesy z pedála do stránky
const kbin=$('kbin');
function initPedal(msg){
  try{kbin.focus({preventScroll:true})}catch(_){}
  if(msg&&readerOpen()){armAt=Date.now();toast('Stlač pedál –\nak nereaguje, zapni M-Vave Cube Turner',2200)}
}
document.addEventListener('pointerdown',()=>initPedal(false),true);
kbin.addEventListener('blur',()=>setTimeout(()=>{if(!document.hidden)initPedal(false)},250));
window.addEventListener('focus',()=>initPedal(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)initPedal(false)});
$('ped').addEventListener('click',()=>initPedal(true));$('ped2').addEventListener('click',()=>initPedal(true));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)stop();
  else{armAt=Date.now();pedalCheck()}
  if(!document.hidden&&readerOpen()&&st.mode==='pdf'){wake=null;keepAwake(true)}
});
apply();initPedal(false);pedalUI();
</script>
